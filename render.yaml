services:
  - type: web
    name: great-coders
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: https://great-coders.onrender.com
      - key: APP_BASE_URL
        value: https://great-coders.onrender.com
      - key: SUPABASE_CA_CERT
        sync: false
